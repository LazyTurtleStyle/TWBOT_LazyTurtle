# Optional companion to twb.service: caps the system journal, where the bot's
# output ends up when it runs as a service. Without it the journal may take
# 10% of the disk. This applies to the whole system's journal, not only the
# bot's part of it - systemd has no narrower setting. See twb.service for the
# three commands that install it.

[Journal]
SystemMaxUse=200M
