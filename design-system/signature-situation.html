<!-- @dsCard group="Signature" name="Situation bar" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css"></head>
<body>
	<div class="stack" style="max-width:760px">
		<div class="situation clear">
			<div><div class="sit-state">All quiet</div><div class="sit-sub">No incoming attacks · last activity 12m ago</div></div>
			<div class="sit-spacer"></div>
			<div class="threat">
				<div class="t"><div class="v">1</div><div class="k">villages</div></div>
				<div class="t"><div class="v" style="color:var(--gold)">35,115</div><div class="k">recent loot</div></div>
			</div>
		</div>
		<div class="situation alert">
			<div><div class="sit-state">&#9876; Under attack</div><div class="sit-sub">3 incoming across 1 village</div></div>
			<div class="sit-spacer"></div>
			<div class="threat">
				<div class="t"><div class="v blood">3</div><div class="k">incoming</div></div>
				<div class="t"><div class="v blood mono">04:32</div><div class="k">soonest lands</div></div>
			</div>
		</div>
		<div class="situation warn">
			<div><div class="sit-state">Tracking offline</div><div class="sit-sub">The session cookie has expired, refresh it to detect attacks.</div></div>
		</div>
	</div>
</body></html>
