<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>TWB Session Restore · Options</title>
	<style>
		body { background: #15130E; color: #F1EAD9; font-family: system-ui, sans-serif; padding: 32px; max-width: 480px; }
		h2 { font-size: 18px; margin: 0 0 16px; }
		label { display: block; font-size: 13px; color: #C0B7A5; margin-bottom: 6px; }
		input { width: 100%; box-sizing: border-box; background: #282318; color: #F1EAD9; border: 1px solid #322E28; border-radius: 6px; padding: 9px 12px; font-family: ui-monospace, monospace; font-size: 13px; }
		button { margin-top: 12px; background: #E07B2C; color: #fff; border: none; border-radius: 6px; padding: 8px 18px; font-size: 13px; font-weight: 600; cursor: pointer; }
		#status { margin-left: 10px; font-size: 13px; color: #93A56A; }
		small { display: block; margin-top: 14px; color: #968D7B; font-size: 12px; line-height: 1.5; }
	</style>
</head>
<body>
	<h2>TWB Session Restore</h2>
	<label for="server">Webmanager address</label>
	<input id="server" type="text" placeholder="http://localhost:5000">
	<label for="world" style="margin-top:16px">World <span style="color:#968D7B">(optional, e.g. nl99 — empty = most recently active)</span></label>
	<input id="world" type="text" placeholder="nl99">
	<button id="save">Save</button><span id="status"></span>
	<small>The address where the TWB web dashboard runs. The extension fetches <code>/app/tw-cookies-export</code> from it when you click the toolbar icon.</small>
	<script src="options.js"></script>
</body>
</html>
